summary: >-
  No official hosted or remote Model Context Protocol server exists for ODNI, and none should be implied.
  Searched the ODNI site, the site's own route index (no mcp namespace), npm @modelcontextprotocol, the
  public MCP registries, and every ODNI-shaped hostname; nothing exists. ODNI has no verifiable GitHub
  organization. The tools below are DERIVED by API Evangelist from the public content API as a proposal
  only. They are not published by ODNI. The apis.yml pointer is type X-MCPServerCandidate, NOT MCPServer,
  because no server exists.
