implementation_note: >-
  Any implementer must use the query-string route form (https://www.odni.gov/?rest_route=/wp/v2/...) and
  a plain, non-browser User-Agent. The canonical /wp-json/ base 301s to the homepage, and browser-shaped
  User-Agent strings are refused with 403 by the edge.
