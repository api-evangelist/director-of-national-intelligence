apis:
- aid: director-of-national-intelligence:odni-public-content-api
  name: ODNI Public Content API
  description: The anonymous, read-only WordPress REST API behind www.odni.gov. Serves ODNI newsroom posts
    (press releases, remarks, interviews and reports), the site's structural pages, the media library,
    and the Download Monitor catalog of published ODNI documents. DERIVED description — ODNI publishes
    no specification; the OpenAPI here was derived from the live route discovery document and every operation
    was confirmed 200 anonymously on 2026-09-06. The canonical /wp-json/ root is 301'd to the homepage
    by the site's Akamai edge, so the API is reachable only through the query-string route form https://www.odni.gov/?rest_route=/...
    . Content only — no intelligence holdings are exposed.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/director-of-national-intelligence.png
