name: Director of National Intelligence
description: The Office of the Director of National Intelligence (ODNI) leads intelligence integration
  across the United States Intelligence Community. The DNI serves as head of the IC, principal intelligence
  adviser to the President, and oversees and coordinates the foreign and domestic activities of the 18
  IC elements. ODNI houses the National Counterterrorism Center, the National Counterintelligence and
  Security Center, the Office of Economic Security and Emerging Technologies, the Mission Integration
  and Policy & Capabilities directorates, and the IC Inspector General. ODNI publishes no developer program
  and no machine-readable specification of its own; its public content — newsroom press releases, remarks,
  interviews, the Annual Threat Assessment, the annual IC transparency reports, IC directives and NCTC
  counterterrorism guides — is served from a WordPress site at www.odni.gov whose REST API answers anonymously
  and is catalogued here.
