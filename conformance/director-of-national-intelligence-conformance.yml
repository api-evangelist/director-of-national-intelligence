domain_standards:
  note: >-
    The domain standard for this provider's market is the Intelligence Community technical specification
    family that ODNI's own IC CIO authored — Information Security Marking (ISM.XML), Need-To-Know
    (NTK.XML), Access Rights and Handling (ARH), Trusted Data Format (TDF), IC-ID, IC-SF and IC-GENC.
    This is the rare case where the provider IS the standards body for its sector. It is recorded as
    NOT conformant on the catalogued surface for a precise reason: none of those markings appear anywhere
    in the public content API, and ODNI no longer serves the schemas themselves.
  standards:
    - id: ic-ism
      name: Information Security Marking Metadata (ISM.XML)
      authored_by_this_provider: true
      conforms: false
      evidence: >-
        No ISM attributes, classification markings or security-marking metadata appear on any record
        returned by the public content API; the content is unclassified public affairs material. The
        ODNI-published schema pages are themselves no longer served (see lifecycle/removed_surfaces).
    - id: ic-ntk
      name: Need-To-Know Metadata (NTK.XML)
      authored_by_this_provider: true
      conforms: false
      evidence: Not present on the public surface; schema pages removed.
    - id: ic-trusted-data-format
      name: Trusted Data Format (TDF)
      authored_by_this_provider: true
      conforms: false
      evidence: Not present on the public surface; schema pages removed.
compliance_program:
  published: false
  certifications: []
  trust_center: null
  note: >-
    ODNI publishes no trust center, no certification list and no compliance program page — it is a
    federal agency, not a vendor, and is governed by statute and executive order rather than by
    third-party audit certificates. No Compliance or TrustCenter pointer is wired, because no such
    published program exists to point at.
vulnerability_disclosure:
  published: false
  note: >-
    Notable absence. CISA Binding Operational Directive 20-01 directs federal civilian agencies to
    publish a vulnerability disclosure policy at a well-known location. Probed 2026-09-06:
    /vulnerability-disclosure-policy, /vdp, /vulnerability-disclosure, /report-vulnerability and
    /.well-known/security.txt all return a redirect to the site homepage. No Security or
    VulnerabilityDisclosure pointer is wired.
  evidence:
    - {url: 'https://www.odni.gov/vulnerability-disclosure-policy', status: 302, followed: 'https://www.odni.gov/'}
    - {url: 'https://www.odni.gov/.well-known/security.txt', status: 302, followed: 'https://www.odni.gov/'}
