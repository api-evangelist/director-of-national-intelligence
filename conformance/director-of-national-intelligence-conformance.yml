standards:
  - id: rest
    conforms: true
    evidence: Resource-oriented JSON over HTTPS with GET semantics; collections and item routes.
  - id: rfc8288-web-linking
    conforms: true
    evidence: 'Link header carries rel="next" / rel="prev" on paginated collections (observed on /wp/v2/posts).'
  - id: oembed-1.0
    conforms: true
    evidence: 'The oembed/1.0 namespace is registered in the route index and /oembed/1.0/embed returns an oEmbed 1.0 document (200, verified 2026-09-06).'
  - id: hal-style-hypermedia
    conforms: partial
    evidence: >-
      Every record carries a _links object with self/collection/about/author/curies, but the link values
      use the /wp-json/ base which the edge 301s, so the hypermedia is present and not followable.
  - id: rfc9457-problem-details
    conforms: false
    evidence: 'Errors are application/json in the WordPress envelope {code, message, data.status}; no application/problem+json is served.'
  - id: oauth2
    conforms: false
    evidence: No oauth2 security scheme; no /.well-known/oauth-authorization-server (302 to homepage).
  - id: oidc
    conforms: false
    evidence: '/.well-known/openid-configuration returns 302 to the homepage; no OIDC discovery document.'
  - id: rfc9116-security-txt
    conforms: false
    evidence: '/.well-known/security.txt returns 302 to the homepage on every host (see well-known/).'
  - id: rfc8594-sunset-header
    conforms: false
    evidence: No Sunset or Deprecation headers on any observed response.
  - id: rfc9239-ratelimit-headers
    conforms: false
    evidence: No RateLimit-* or X-RateLimit-* headers on any observed response.
  - id: apis-json
    conforms: false
    evidence: '/apis.json, /apis.yml and /.well-known/apis.json all 302 to the homepage.'
  - id: openapi
    conforms: false
    evidence: >-
      ODNI publishes no OpenAPI. The specification in this repo was DERIVED by API Evangelist from the
      live route discovery document and is marked as such; it is not an ODNI conformance claim.
  - id: mcp
    conforms: false
    evidence: No MCP server is published; the manifest in mcp/ is a candidate, not a server.
  - id: a2a
    conforms: false
    evidence: 'No agent card at /.well-known/agent-card.json or /.well-known/agent.json on any host (302 to homepage).'
